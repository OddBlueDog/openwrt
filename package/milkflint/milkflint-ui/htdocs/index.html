<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/milkflint/favicon.svg" type="image/svg+xml" />
    <title>Router</title>
    <script>
      // Apply the router's theme (as this browser last saw it) and this
      // device's light/dark choice before first paint (no flash);
      // src/lib/theme.ts keeps them in step from then on.
      (function () {
        var scheme = null;
        var theme = null;
        var css = null;
        try {
          scheme = localStorage.getItem('milkflint.theme');
          theme = localStorage.getItem('milkflint.theme-id');
          // the router's custom themes, as this browser last saw them
          css = localStorage.getItem('milkflint.theme-css');
        } catch (e) {}
        if (css) {
          var style = document.createElement('style');
          style.id = 'mf-custom-themes';
          style.textContent = css;
          document.head.appendChild(style);
        }
        var dark = scheme === 'dark' || (scheme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.setAttribute('data-theme', theme && /^[a-z][a-z0-9-]*$/.test(theme) ? theme : 'honey-milk');
        root.setAttribute('data-darkmode', dark ? 'true' : 'false');
      })();
    </script>
    
    <link rel="modulepreload" crossorigin href="/milkflint/assets/react-yIOJJ3r4.js">
    <link rel="modulepreload" crossorigin href="/milkflint/assets/button-S0Mir7og.js">
    <link rel="modulepreload" crossorigin href="/milkflint/assets/on-request-DVC5WeuW.js">
    <link rel="modulepreload" crossorigin href="/milkflint/assets/es2015-NUMpgs7h.js">
    
  <script>
      fetch('/milkflint/manifest.json', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (m) {
          m.css.forEach(function (href) {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = href;
            document.head.appendChild(l);
          });
          var s = document.createElement('script');
          s.type = 'module';
          s.src = m.js;
          document.head.appendChild(s);
        });
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
